<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTL – Compagnie Tra-Log SARL | Transit, Logistique & Douane</title>
<meta name="description" content="Compagnie Tra-Log SARL : transit, dédouanement, logistique et supply chain à Ouagadougou. Demandez votre devis.">

</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://otdiywrvzappbmjfkkyi.supabase.co" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="icon" type="image/jpeg" href="transport/logo.jpg">
<link rel="preload" as="image" href="transport/logo.jpg">
<link rel="preload" as="image" href="transport/im5.jpg" fetchpriority="high">
<style>
/* ... styles inchangés ... */
</style>
</head>
<body class="is-loading">
<!-- ... le reste du HTML inchangé ... -->

<script>
(function(){
  'use strict';

  // ===== CONFIG =====
  const SUPABASE_URL = "https://otdiywrvzappbmjfkkyi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90ZGl5d3J2emFwcGJtamZra3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTQyMDcsImV4cCI6MjA4NTE5MDIwN30.O5gHqJF1SCvpu19Z0OFHhQsT_ZmeIFbuEu-bpBZXXtY";
  const ADMIN_PASSWORD = "tralog2026";
  const SESSION_KEY = "tralog_admin";
  const WHATSAPP = "22676853514";
  const CARRIERE_LABELS = { carriere: "Offre de carrière", emploi: "Offre d'emploi", stage: "Offre de stage" };

  const $ = (s, ctx) => (ctx || document).querySelector(s);
  const $$ = (s, ctx) => Array.from((ctx || document).querySelectorAll(s));
  const escapeHTML = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ===== ACCÈS DONNÉES : REST direct (plus de SDK) =====
  const REST = SUPABASE_URL + '/rest/v1/';
  const HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY };
  const fetchTable = async (table) => {
    const r = await fetch(REST + table + '?select=*&published=eq.true&order=created_at.desc', { headers: HEADERS });
    if (!r.ok) throw new Error(table + ' ' + r.status);
    return r.json();
  };

  // ===== PRELOADER / HERO / NAV / SCROLL =====
  const header = $('#header');
  const bar = $('#progress');
  const hero = $('.hero');
  const pre = $('#preloader');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;

  const slides = $$('.hero-slide');
  const dots = $$('.hero-dot');
  let slideIdx = 0;

  const showSlide = i => {
    slideIdx = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle('is-active', k === slideIdx));
    dots.forEach((d, k) => {
      d.classList.toggle('is-active', k === slideIdx);
      d.setAttribute('aria-selected', String(k === slideIdx));
    });
  };

  if (slides.length) {
    slides.forEach(s => {
      const im = s.querySelector('img');
      if (!im) return;
      const ok = () => im.classList.add('loaded');
      if (im.complete && im.naturalWidth) ok();
      else im.addEventListener('load', ok, { once: true });
    });

    let started = false;
    const startHero = () => {
      if (started) return;
      started = true;
      if (pre) pre.classList.add('done');
      document.body.classList.remove('is-loading');

      slides.slice(1).forEach(s => {
        const im = s.querySelector('img');
        if (im && im.dataset.src) {
          im.src = im.dataset.src;
          im.removeAttribute('data-src');
          const ok = () => im.classList.add('loaded');
          if (im.complete && im.naturalWidth) ok();
          else im.addEventListener('load', ok, { once: true });
        }
      });

      showSlide(0);

      if (slides.length > 1) {
        setInterval(() => {
          const nextImg = slides[(slideIdx + 1) % slides.length].querySelector('img');
          if (nextImg && nextImg.complete && nextImg.naturalWidth) {
            showSlide(slideIdx + 1);
          }
        }, 3000);
      }
    };

    const firstImg = slides[0].querySelector('img');
    if (firstImg && firstImg.complete && firstImg.naturalWidth) startHero();
    else if (firstImg) {
      firstImg.addEventListener('load', startHero, { once: true });
      firstImg.addEventListener('error', startHero, { once: true });
      setTimeout(startHero, 1500);
    } else {
      startHero();
    }

    dots.forEach((d, i) => d.addEventListener('click', () => {
      const im = slides[i].querySelector('img');
      if (!im) return;
      if (im.dataset.src) { im.src = im.dataset.src; im.removeAttribute('data-src'); }
      if (im.complete && im.naturalWidth) showSlide(i);
      else im.addEventListener('load', () => showSlide(i), { once: true });
    }));
  } else {
    if (pre) pre.classList.add('done');
    document.body.classList.remove('is-loading');
  }

  const onScroll = () => {
    if (header) header.classList.toggle('scrolled', window.scrollY > 40);
    if (bar) {
      const h = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
    }
    if (hero && !reduce && window.matchMedia('(min-width:901px)').matches && scrollY < innerHeight * 1.2) {
      hero.style.setProperty('--py', Math.min(scrollY * 0.3, 190) + 'px');
    }
  };
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // ===== ... navigation, reveals, tilt, spy, forms inchangés ... =====

  // ===== ACTUALITÉS & CARRIÈRES (cache + fetch) =====
  let ACTUALITES = [];
  let CARRIERES = [];
  let carriereFilter = 'all';

  function renderActualites() {
    const container = $('#actualitesContainer');
    if (!container) return;
    if (!ACTUALITES.length) {
      container.innerHTML = `<div class="news-empty">
        <div class="news-empty-icon">📰</div>
        <h3>Aucune actualité pour le moment</h3>
        <p>Revenez bientôt pour découvrir nos dernières nouvelles.</p>
      </div>`;
      return;
    }
    container.innerHTML = '<div class="actu-grid">' + ACTUALITES.map((a, i) => `
      <article class="actu-card" data-actualite-id="${a.id}" style="animation-delay:${(i * 0.08).toFixed(2)}s">
        <div class="actu-card__img">
          <img src="${escapeHTML(a.img)}" alt="${escapeHTML(a.title)}" loading="lazy" onerror="this.style.opacity=.3">
        </div>
        <div class="actu-card__body">
          ${a.category ? `<span class="actu-card__cat">${escapeHTML(a.category)}</span>` : ''}
          <h3>${escapeHTML(a.title)}</h3>
          ${a.excerpt ? `<p>${escapeHTML(a.excerpt)}</p>` : ''}
          <div class="actu-card__meta">
            ${a.date_publication ? `<span>📅 ${escapeHTML(a.date_publication)}</span>` : ''}
            ${a.author ? `<span>✍ ${escapeHTML(a.author)}</span>` : ''}
          </div>
          <span class="actu-card__more">Lire la suite →</span>
        </div>
      </article>
    `).join('') + '</div>';
  }

  function renderCarrieres() {
    const container = $('#carrieresContainer');
    if (!container) return;
    const list = carriereFilter === 'all' ? CARRIERES : CARRIERES.filter(c => c.type === carriereFilter);
    if (!list.length) {
      container.innerHTML = `<div class="news-empty">
        <div class="news-empty-icon">💼</div>
        <h3>Aucune offre ${carriereFilter === 'all' ? 'disponible' : 'pour ce filtre'}</h3>
        <p>Revenez bientôt pour découvrir nos nouvelles opportunités.</p>
      </div>`;
      return;
    }
    container.innerHTML = '<div class="carriere-grid">' + list.map((c, i) => `
      <article class="carriere-card" data-carriere-id="${c.id}" style="animation-delay:${(i * 0.08).toFixed(2)}s">
        <div class="carriere-card__head">
          <span class="carriere-card__badge carriere-card__badge--${escapeHTML(c.type)}">${escapeHTML(CARRIERE_LABELS[c.type] || c.type)}</span>
          ${c.type_contrat ? `<span class="carriere-card__contrat">${escapeHTML(c.type_contrat)}</span>` : ''}
        </div>
        <h3>${escapeHTML(c.title)}</h3>
        <p>${escapeHTML((c.description || '').slice(0, 160))}${(c.description || '').length > 160 ? '…' : ''}</p>
        <div class="carriere-card__meta">
          ${c.location ? `<span>📍 ${escapeHTML(c.location)}</span>` : ''}
          ${c.department ? `<span>🏢 ${escapeHTML(c.department)}</span>` : ''}
          ${c.date_limite ? `<span>⏰ ${escapeHTML(c.date_limite)}</span>` : ''}
        </div>
        <span class="carriere-card__more">Voir l'offre →</span>
      </article>
    `).join('') + '</div>';
  }

  const CACHE_KEY = 'ctl_cache_v1';
  async function loadDynamicContent() {
    let cachedStr = '';
    try {
      cachedStr = localStorage.getItem(CACHE_KEY) || '';
      if (cachedStr) {
        const cached = JSON.parse(cachedStr);
        ACTUALITES = cached.a || []; CARRIERES = cached.c || [];
        renderActualites(); renderCarrieres();
      }
    } catch (e) {}
    try {
      const [a, c] = await Promise.all([fetchTable('actualites'), fetchTable('carrieres')]);
      const fresh = JSON.stringify({ a, c });
      if (fresh === cachedStr) return;
      ACTUALITES = a; CARRIERES = c;
      try { localStorage.setItem(CACHE_KEY, fresh); } catch (e) {}
      renderActualites(); renderCarrieres();
    } catch (e) {
      console.error('[CTL] loadDynamic:', e);
      if (!cachedStr) { renderActualites(); renderCarrieres(); }
    }
  }

  // ===== ... modals, filtres, login admin inchangés ... =====

  // ===== BOOT — on laisse les images passer en premier =====
  if (document.readyState === 'complete') loadDynamicContent();
  else addEventListener('load', loadDynamicContent);
})();

// Safety preloader fallback
window.addEventListener('load', () => setTimeout(() => {
  const pre = document.getElementById('preloader');
  if (pre && !pre.classList.contains('done')) {
    pre.classList.add('done');
    document.body.classList.remove('is-loading');
  }
}, 2500));
</script>
</body>
</html>
